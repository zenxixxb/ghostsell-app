<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostSell</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: #0f0f0f; color: #fff; padding: 20px; min-height: 100vh; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 28px; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { color: #888; font-size: 14px; margin-top: 8px; }
        .balance-card { background: linear-gradient(135deg, #1a1a2e, #16213e); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid #2a2a3e; }
        .balance-label { color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .balance-amount { font-size: 32px; font-weight: bold; margin-top: 8px; color: #4ade80; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 10px; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-secondary { background: #1a1a2e; color: #fff; border: 1px solid #2a2a3e; }
        .product-card { background: #1a1a2e; border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid #2a2a3e; display: flex; justify-content: space-between; align-items: center; }
        .product-info h3 { font-size: 16px; margin-bottom: 4px; }
        .product-info p { color: #888; font-size: 13px; }
        .product-price { color: #4ade80; font-weight: bold; font-size: 18px; }
        .buy-btn { background: #4ade80; color: #000; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-left: 12px; }
        .section-title { font-size: 18px; font-weight: 600; margin: 24px 0 12px; }
        .loader { color: #888; text-align: center; padding: 20px; }
        .order-card { background: #1a1a2e; border-radius: 12px; padding: 14px; margin-bottom: 10px; border: 1px solid #2a2a3e; }
        .order-card h4 { font-size: 15px; margin-bottom: 6px; }
        .order-card p { color: #888; font-size: 13px; margin-bottom: 3px; }
        .order-card .status { color: #4ade80; font-weight: 600; }
    </style>
</head>
<body>
    <div class="header">
        <h1>👻 GhostSell</h1>
        <p id="username">Загрузка...</p>
    </div>

    <div class="balance-card">
        <div class="balance-label">Баланс</div>
        <div class="balance-amount" id="balance">— ₽</div>
    </div>

    <button class="btn btn-primary" onclick="topup()">💳 Пополнить баланс</button>
    <button class="btn btn-secondary" onclick="toggleOrders()">📋 Мои заказы</button>

    <div id="orders-block" style="display:none">
        <div class="section-title">📋 Мои заказы</div>
        <div id="orders" class="loader">Загрузка заказов...</div>
    </div>

    <div class="section-title">📦 Каталог</div>
    <div id="products" class="loader">Загрузка товаров...</div>

    <script>
        const API_URL = 'https://ghostsell-api.onrender.com';
        
        const tg = window.Telegram.WebApp;
        tg.ready();

        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('username').textContent = 
                `@${user.username || 'без_ника'} · ID: ${user.id}`;
        }

        async function loadBalance() {
            try {
                const response = await fetch(API_URL + '/api/balance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: user?.id })
                });
                const data = await response.json();
                document.getElementById('balance').textContent = `${data.balance} ₽`;
            } catch (e) {
                console.error('Ошибка баланса:', e);
                document.getElementById('balance').textContent = '0 ₽';
            }
        }

        async function loadProducts() {
            try {
                const response = await fetch(API_URL + '/api/products');
                const data = await response.json();
                const container = document.getElementById('products');
                if (!data.products || data.products.length === 0) {
                    container.className = 'loader';
                    container.innerHTML = '😕 Товаров нет';
                    return;
                }
                container.className = '';
                container.innerHTML = data.products.map(p => `
                    <div class="product-card">
                        <div class="product-info">
                            <h3>${p.emoji || '🌍'} ${p.name}</h3>
                            <p>В наличии: ${p.count} шт.</p>
                        </div>
                        <div style="display:flex;align-items:center">
                            <span class="product-price">${p.price} ₽</span>
                            <button class="buy-btn" onclick="buy('${p.key}')">Купить</button>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Ошибка товаров:', e);
                document.getElementById('products').innerHTML = '❌ Ошибка загрузки';
            }
        }

        async function loadOrders() {
            try {
                const response = await fetch(API_URL + '/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: user?.id })
                });
                const data = await response.json();
                const container = document.getElementById('orders');
                
                if (!data.orders || data.orders.length === 0) {
                    container.className = 'loader';
                    container.innerHTML = '📭 Заказов нет';
                    return;
                }
                
                container.className = '';
                container.innerHTML = data.orders.map((o, i) => `
                    <div class="order-card">
                        <h4>${i+1}. ${o.product}</h4>
                        <p>💰 ${o.price} ₽</p>
                        <p>📱 ${o.number || o.phone || '—'}</p>
                        <p class="status">✅ ${o.status}</p>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Ошибка заказов:', e);
                document.getElementById('orders').innerHTML = '❌ Ошибка загрузки';
            }
        }

        function toggleOrders() {
            const block = document.getElementById('orders-block');
            if (block.style.display === 'none') {
                block.style.display = 'block';
                loadOrders();
            } else {
                block.style.display = 'none';
            }
        }

        async function buy(key) {
            tg.showConfirm('Купить товар?', async (confirmed) => {
                if (!confirmed) return;
                try {
                    const response = await fetch(API_URL + '/api/buy', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: user?.id, key: key })
                    });
                    const data = await response.json();
                    if (data.success) {
                        tg.showAlert(`✅ ${data.message}\n\nНовый баланс: ${data.balance} ₽`);
                        loadBalance();
                        loadProducts();
                    } else {
                        tg.showAlert(`❌ ${data.error}`);
                    }
                } catch (e) {
                    tg.showAlert('❌ Ошибка сети');
                }
            });
        }

        function topup() {
            tg.showPopup({
                title: '💳 Пополнение баланса',
                message: 'Для пополнения напиши @zilfrec',
                buttons: [
                    {id: 'contact', type: 'default', text: '📩 Написать @zilfrec'},
                    {id: 'cancel', type: 'cancel'}
                ]
            }, (buttonId) => {
                if (buttonId === 'contact') {
                    tg.openTelegramLink('https://t.me/zilfrec');
                }
            });
        }

        if (user) {
            loadBalance();
        } else {
            document.getElementById('balance').textContent = '0 ₽';
        }
        loadProducts();
    </script>
</body>
</html>
