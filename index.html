<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostSell</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: #0f0f0f; color: #fff; padding: 20px; min-height: 100vh; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 28px; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { color: #888; font-size: 14px; margin-top: 8px; }
        .balance-card { background: linear-gradient(135deg, #1a1a2e, #16213e); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid #2a2a3e; }
        .balance-label { color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .balance-amount { font-size: 32px; font-weight: bold; margin-top: 8px; color: #4ade80; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 10px; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-secondary { background: #1a1a2e; color: #fff; border: 1px solid #2a2a3e; }
        .product-card { background: #1a1a2e; border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid #2a2a3e; display: flex; justify-content: space-between; align-items: center; }
        .product-info h3 { font-size: 16px; margin-bottom: 4px; }
        .product-info p { color: #888; font-size: 13px; }
        .product-price { color: #4ade80; font-weight: bold; font-size: 18px; }
        .buy-btn { background: #4ade80; color: #000; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-left: 12px; }
        .section-title { font-size: 18px; font-weight: 600; margin: 24px 0 12px; }
        .loader { color: #888; text-align: center; padding: 20px; }
        .order-card { background: #1a1a2e; border-radius: 12px; padding: 14px; margin-bottom: 10px; border: 1px solid #2a2a3e; }
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .order-header h4 { font-size: 15px; }
        .order-card p { color: #888; font-size: 13px; margin-bottom: 4px; }
        .order-card .status { font-size: 18px; }
        .login-btn { width: 100%; margin-top: 10px; padding: 10px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; }
        .login-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="header">
        <h1>👻 GhostSell</h1>
        <p id="username">Загрузка...</p>
    </div>

    <div class="balance-card">
        <div class="balance-label">Баланс</div>
        <div class="balance-amount" id="balance">— ₽</div>
    </div>

    <button class="btn btn-primary" onclick="пополнить()">💳 Пополнить баланс</button>
    <button class="btn btn-secondary" onclick="переключитьЗаказы()">📋 Мои заказы</button>

    <div id="orders-block" style="display:none">
        <div class="section-title">📋 Мои заказы</div>
        <div id="orders" class="loader">Загрузка заказов...</div>
    </div>

    <div class="section-title">📦 Каталог</div>
    <div id="products" class="loader">Загрузка товаров...</div>

    <script>
        const API_URL = 'https://ghostsell-api.onrender.com';

        const tg = window.Telegram.WebApp;
        tg.ready();

        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('username').textContent =
                `@${user.username || 'без_ника'} · ID: ${user.id}`;
        }

        let заказыПользователя = [];

        async function загрузитьБаланс() {
            try {
                const ответ = await fetch(API_URL + '/api/balance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: user?.id })
                });
                const данные = await ответ.json();
                document.getElementById('balance').textContent = `${данные.balance} ₽`;
            } catch (ошибка) {
                console.error('Ошибка баланса:', ошибка);
                document.getElementById('balance').textContent = '0 ₽';
            }
        }

        async function загрузитьТовары() {
            try {
                const ответ = await fetch(API_URL + '/api/products');
                const данные = await ответ.json();
                const контейнер = document.getElementById('products');
                if (!данные.products || данные.products.length === 0) {
                    контейнер.className = 'loader';
                    контейнер.innerHTML = '😕 Товаров нет';
                    return;
                }
                контейнер.className = '';
                контейнер.innerHTML = данные.products.map(товар => `
                    <div class="product-card">
                        <div class="product-info">
                            <h3>${товар.emoji || '🌍'} ${товар.name}</h3>
                            <p>В наличии: ${товар.count} шт.</p>
                        </div>
                        <div style="display:flex;align-items:center">
                            <span class="product-price">${товар.price} ₽</span>
                            <button class="buy-btn" onclick="купить('${товар.key}')">Купить</button>
                        </div>
                    </div>
                `).join('');
            } catch (ошибка) {
                console.error('Ошибка товаров:', ошибка);
                document.getElementById('products').innerHTML = '❌ Ошибка загрузки';
            }
        }

        async function загрузитьЗаказы() {
            try {
                const ответ = await fetch(API_URL + '/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: user?.id })
                });
                const данные = await ответ.json();
                заказыПользователя = данные.orders || [];
                const контейнер = document.getElementById('orders');

                if (!заказыПользователя || заказыПользователя.length === 0) {
                    контейнер.className = 'loader';
                    контейнер.innerHTML = '📭 Заказов нет';
                    return;
                }

                контейнер.className = '';
                контейнер.innerHTML = заказыПользователя.map((заказ, номер) => `
                    <div class="order-card">
                        <div class="order-header">
                            <h4>${номер + 1}. ${заказ.product}</h4>
                            <span class="status">${заказ.status === 'одобрен' ? '✅' : '⏳'}</span>
                        </div>
                        <p>💰 ${заказ.price} ₽</p>
                        <p>📱 ${заказ.number || заказ.phone || '—'}</p>
                        <button class="login-btn" onclick="открытьВход(${номер})">🔑 Войти</button>
                    </div>
                `).join('');
            } catch (ошибка) {
                console.error('Ошибка заказов:', ошибка);
                document.getElementById('orders').innerHTML = '❌ Ошибка загрузки';
            }
        }

        function открытьВход(номер) {
            const заказ = заказыПользователя[номер];
            const телефон = заказ.number || заказ.phone || '—';

            tg.showPopup({
                title: '🔑 Вход в аккаунт',
                message: `📱 Номер: ${телефон}\n\nНажми «Получить код» — админ отправит код в этот чат с ботом.`,
                buttons: [
                    { id: 'get_code', type: 'default', text: '📩 Получить код' },
                    { id: 'cancel', type: 'cancel', text: 'Отмена' }
                ]
            }, async (нажатаКнопка) => {
                if (нажатаКнопка === 'get_code') {
                    await запроситьКод(номер, телефон);
                }
            });
        }

        async function запроситьКод(номер, телефон) {
            try {
                const ответ = await fetch(API_URL + '/api/request_code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: user?.id,
                        order_index: номер,
                        phone: телефон
                    })
                });
                const данные = await ответ.json();
                if (данные.success) {
                    tg.showAlert('✅ Запрос отправлен!\n\nКод придёт в этот чат в течение 1-2 минут.');
                } else {
                    tg.showAlert(`❌ ${данные.error}`);
                }
            } catch (ошибка) {
                tg.showAlert('❌ Ошибка сети');
            }
        }

        function переключитьЗаказы() {
            const блок = document.getElementById('orders-block');
            if (блок.style.display === 'none') {
                блок.style.display = 'block';
                загрузитьЗаказы();
            } else {
                блок.style.display = 'none';
            }
        }

        async function купить(ключ) {
            tg.showConfirm('Купить товар?', async (подтверждено) => {
                if (!подтверждено) return;
                try {
                    const ответ = await fetch(API_URL + '/api/buy', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: user?.id, key: ключ })
                    });
                    const данные = await ответ.json();
                    if (данные.success) {
                        tg.showAlert(`✅ ${данные.message}\n\nНовый баланс: ${данные.balance} ₽`);
                        загрузитьБаланс();
                        загрузитьТовары();
                    } else {
                        tg.showAlert(`❌ ${данные.error}`);
                    }
                } catch (ошибка) {
                    tg.showAlert('❌ Ошибка сети');
                }
            });
        }

        function пополнить() {
            tg.showPopup({
                title: '💳 Пополнение баланса',
                message: 'Для пополнения напиши @zilfrec',
                buttons: [
                    { id: 'contact', type: 'default', text: '📩 Написать @zilfrec' },
                    { id: 'cancel', type: 'cancel' }
                ]
            }, (нажатаКнопка) => {
                if (нажатаКнопка === 'contact') {
                    tg.openTelegramLink('https://t.me/zilfrec');
                }
            });
        }

        if (user) {
            загрузитьБаланс();
        } else {
            document.getElementById('balance').textContent = '0 ₽';
        }
        загрузитьТовары();
    </script>
</body>
</html>
