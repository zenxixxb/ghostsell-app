<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GhostSell</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #14141f;
            --bg-card: rgba(26, 26, 46, 0.7);
            --border: rgba(102, 126, 234, 0.2);
            --text-primary: #ffffff;
            --text-secondary: #888899;
            --accent: #667eea;
            --accent-2: #764ba2;
            --accent-3: #f093fb;
            --success: #4ade80;
            --danger: #ef4444;
            --warning: #fbbf24;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== АНИМИРОВАННЫЙ ФОН С ЧАСТИЦАМИ ===== */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: linear-gradient(180deg, #0a0a0f 0%, #14141f 100%);
        }

        /* Плавающие градиентные шары */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s ease-in-out infinite;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #667eea, transparent);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #764ba2, transparent);
            bottom: -150px;
            right: -150px;
            animation-delay: -7s;
        }

        .orb-3 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #f093fb, transparent);
            top: 40%;
            right: -100px;
            animation-delay: -14s;
            opacity: 0.2;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.1); }
            66% { transform: translate(-50px, 50px) scale(0.9); }
        }

        /* Звёзды на фоне */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(1px 1px at 20% 30%, white, transparent),
                radial-gradient(1px 1px at 60% 70%, white, transparent),
                radial-gradient(1px 1px at 50% 50%, white, transparent),
                radial-gradient(1px 1px at 80% 10%, white, transparent),
                radial-gradient(1px 1px at 90% 60%, white, transparent),
                radial-gradient(2px 2px at 15% 80%, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 70% 25%, rgba(255,255,255,0.6), transparent);
            background-size: 200% 200%;
            animation: twinkle 8s ease-in-out infinite;
            opacity: 0.5;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }

        /* ===== ТОПБАР ===== */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: rgba(10, 10, 15, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(102, 126, 234, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .topbar-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: rgba(26, 26, 46, 0.6);
            border: 1px solid rgba(102, 126, 234, 0.2);
            color: var(--text-primary);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }

        .icon-btn:active {
            transform: scale(0.9);
            background: rgba(102, 126, 234, 0.2);
        }

        /* ===== КОНТЕЙНЕР ===== */
        .container {
            padding: 16px;
            padding-bottom: 100px;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ===== ПРОФИЛЬ ===== */
        .profile-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.15), rgba(240, 147, 251, 0.1));
            border: 1px solid rgba(102, 126, 234, 0.25);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            animation: slideUp 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.3), transparent);
            border-radius: 50%;
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: linear-gradient(135deg, #667eea, #f093fb);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
            position: relative;
            z-index: 1;
        }

        .profile-info {
            position: relative;
            z-index: 1;
            flex: 1;
            min-width: 0;
        }

        .profile-info h3 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-info p {
            color: var(--text-secondary);
            font-size: 12px;
        }

        /* ===== БАЛАНС ===== */
        .balance-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 200% 200%;
            animation: gradientShift 5s ease infinite;
            border-radius: 22px;
            padding: 22px;
            margin-bottom: 14px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.4);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .balance-card:active {
            transform: scale(0.98);
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .balance-card::before {
            content: '';
            position: absolute;
            top: -60%;
            right: -20%;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
        }

        .balance-card::after {
            content: '💰';
            position: absolute;
            bottom: 10px;
            right: 16px;
            font-size: 60px;
            opacity: 0.15;
        }

        .balance-label {
            font-size: 12px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .balance-amount {
            font-size: 34px;
            font-weight: 900;
            position: relative;
            letter-spacing: -1px;
        }

        .balance-amount span {
            font-size: 20px;
            opacity: 0.7;
        }

        /* ===== БЫСТРЫЕ КНОПКИ ===== */
        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .action-btn {
            padding: 14px 12px;
            border: none;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            position: relative;
            overflow: hidden;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }

        .action-btn-secondary {
            background: rgba(26, 26, 46, 0.8);
            color: white;
            border: 1px solid rgba(102, 126, 234, 0.3);
            backdrop-filter: blur(10px);
        }

        /* ===== ПОИСК ===== */
        .search-box {
            position: relative;
            margin-bottom: 14px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            background: rgba(26, 26, 46, 0.7);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 16px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .search-box input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
            background: rgba(26, 26, 46, 0.9);
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            opacity: 0.6;
            pointer-events: none;
        }

        /* ===== ФИЛЬТРЫ ===== */
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .filters::-webkit-scrollbar { display: none; }

        .filter-btn {
            padding: 8px 16px;
            background: rgba(26, 26, 46, 0.7);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 20px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
        }

        /* ===== ЗАГОЛОВКИ ===== */
        .section-title {
            font-size: 17px;
            font-weight: 800;
            margin: 20px 0 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, #667eea, #f093fb);
            border-radius: 2px;
        }

        /* ===== КАРТОЧКА ТОВАРА ===== */
        .product-card {
            background: rgba(26, 26, 46, 0.7);
            border: 1px solid rgba(102, 126, 234, 0.15);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            animation: slideUp 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(102, 126, 234, 0.1), transparent);
            transition: left 0.5s;
        }

        .product-card:active::before {
            left: 100%;
        }

        .product-card:active {
            transform: scale(0.98);
            border-color: #667eea;
        }

        .product-info {
            flex: 1;
            min-width: 0;
        }

        .product-info h3 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-count {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
        }

        .product-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            flex-shrink: 0;
        }

        .product-price {
            color: #4ade80;
            font-weight: 900;
            font-size: 17px;
            letter-spacing: -0.5px;
        }

        .buy-btn {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: #000;
            border: none;
            padding: 8px 18px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(74, 222, 128, 0.3);
        }

        .buy-btn:active {
            transform: scale(0.95);
        }

        /* ===== КАРТОЧКА ЗАКАЗА ===== */
        .order-card {
            background: rgba(26, 26, 46, 0.7);
            border: 1px solid rgba(102, 126, 234, 0.15);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 10px;
            backdrop-filter: blur(10px);
            animation: slideUp 0.3s ease;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .order-header h4 {
            font-size: 15px;
            font-weight: 700;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-approved {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
        }

        .status-pending {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
        }

        .status-declined {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .order-info {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 4px;
        }

        .login-btn {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
        }

        .login-btn:active {
            transform: scale(0.97);
        }

        /* ===== ЗАГРУЗЧИК ===== */
        .loader {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            margin: 0 auto 12px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== НИЖНЯЯ НАВИГАЦИЯ (СТЕКЛЯННАЯ) ===== */
        .bottom-nav {
            position: fixed;
            bottom: 12px;
            left: 12px;
            right: 12px;
            background: rgba(20, 20, 31, 0.8);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(102, 126, 234, 0.2);
            display: flex;
            justify-content: space-around;
            padding: 8px 4px;
            z-index: 100;
            max-width: 600px;
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 8px 4px;
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            background: none;
            border: none;
            border-radius: 12px;
            position: relative;
        }

        .nav-item.active {
            color: #667eea;
            background: rgba(102, 126, 234, 0.15);
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 2px;
            background: linear-gradient(90deg, #667eea, #f093fb);
            border-radius: 2px;
        }

        .nav-icon {
            font-size: 20px;
            transition: transform 0.3s;
        }

        .nav-item.active .nav-icon {
            transform: scale(1.1);
        }

        /* ===== СВЕТЛАЯ ТЕМА ===== */
        body.light {
            --bg-primary: #f5f5f7;
            --bg-secondary: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
        }

        body.light .bg-animation {
            background: linear-gradient(180deg, #e8e8f5 0%, #f5f5f7 100%);
        }

        body.light .topbar {
            background: rgba(255, 255, 255, 0.7);
        }

        body.light .bottom-nav {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(102, 126, 234, 0.3);
        }

        body.light .product-card,
        body.light .order-card,
        body.light .profile-card,
        body.light .search-box input,
        body.light .filter-btn,
        body.light .action-btn-secondary,
        body.light .icon-btn {
            background: rgba(255, 255, 255, 0.9);
            color: #1a1a1a;
        }

        /* ===== ТОСТ ===== */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(150px);
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(102, 126, 234, 0.3);
            color: white;
            padding: 14px 22px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 700;
            z-index: 200;
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.success { border-color: #4ade80; }
        .toast.error { border-color: #ef4444; }

        /* ===== ЗВЁЗДЫ НА БАЛАНСЕ ===== */
        .shimmer {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>

    <!-- АНИМИРОВАННЫЙ ФОН -->
    <div class="bg-animation">
        <div class="stars"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- ТОПБАР -->
    <div class="topbar">
        <div class="logo">👻 GhostSell</div>
        <div class="topbar-actions">
            <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
            <button class="icon-btn" onclick="поддержка()">💬</button>
        </div>
    </div>

    <div class="container">

        <!-- ПРОФИЛЬ -->
        <div class="profile-card">
            <div class="avatar" id="avatar">?</div>
            <div class="profile-info">
                <h3 id="username">Загрузка...</h3>
                <p id="userId">—</p>
            </div>
        </div>

        <!-- БАЛАНС -->
        <div class="balance-card" onclick="пополнить()">
            <div class="shimmer"></div>
            <div class="balance-label">💰 Баланс</div>
            <div class="balance-amount" id="balance">— <span>₽</span></div>
        </div>

        <!-- БЫСТРЫЕ КНОПКИ -->
        <div class="quick-actions">
            <button class="action-btn action-btn-primary" onclick="пополнить()">
                💳 Пополнить
            </button>
            <button class="action-btn action-btn-secondary" onclick="показатьЗаказы()">
                📋 Заказы
            </button>
        </div>

        <!-- ПОИСК -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Поиск товаров..." oninput="renderProducts()">
        </div>

        <!-- ФИЛЬТРЫ -->
        <div class="filters">
            <button class="filter-btn active" onclick="setFilter('all', this)">Все</button>
            <button class="filter-btn" onclick="setFilter('no_spam', this)">🟢 Без спама</button>
            <button class="filter-btn" onclick="setFilter('spam', this)">🔴 Со спамом</button>
            <button class="filter-btn" onclick="setFilter('cheap', this)">💸 Дешёвые</button>
        </div>

        <!-- КАТАЛОГ -->
        <div class="section-title">📦 Каталог</div>
        <div id="products" class="loader">
            <div class="spinner"></div>
            Загрузка товаров...
        </div>

        <!-- ЗАКАЗЫ -->
        <div id="orders-section" style="display:none">
            <div class="section-title">📋 Мои заказы</div>
            <div id="orders" class="loader">
                <div class="spinner"></div>
                Загрузка заказов...
            </div>
        </div>
    </div>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="showTab('catalog', this)">
            <span class="nav-icon">📦</span>
            Каталог
        </button>
        <button class="nav-item" onclick="showTab('orders', this)">
            <span class="nav-icon">📋</span>
            Заказы
        </button>
        <button class="nav-item" onclick="пополнить()">
            <span class="nav-icon">💳</span>
            Пополнить
        </button>
        <button class="nav-item" onclick="поддержка()">
            <span class="nav-icon">💬</span>
            Помощь
        </button>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_URL = 'https://ghostsell-api.onrender.com';

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        let allProducts = [];
        let currentFilter = 'all';

        // ===== ПРОФИЛЬ =====
        if (user) {
            const initial = (user.first_name?.[0] || user.username?.[0] || '?').toUpperCase();
            document.getElementById('avatar').textContent = initial;
            document.getElementById('username').textContent = 
                user.username ? `@${user.username}` : user.first_name || 'Пользователь';
            document.getElementById('userId').textContent = `ID: ${user.id}`;
        }

        // ===== ТЕМА =====
        function toggleTheme() {
            document.body.classList.toggle('light');
            const isLight = document.body.classList.contains('light');
            document.getElementById('themeBtn').textContent = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        }

        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light');
            document.getElementById('themeBtn').textContent = '☀️';
        }

        // ===== TOAST =====
        function showToast(text, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = text;
            toast.className = 'toast show ' + type;
            setTimeout(() => toast.className = 'toast', 3000);
        }

        // ===== ТАБЫ =====
        function showTab(tab, el) {
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            el.classList.add('active');

            if (tab === 'catalog') {
                document.getElementById('products').style.display = 'block';
                document.getElementById('orders-section').style.display = 'none';
            } else if (tab === 'orders') {
                document.getElementById('products').style.display = 'none';
                document.getElementById('orders-section').style.display = 'block';
                loadOrders();
            }
        }

        function показатьЗаказы() {
            const ordersBtn = document.querySelectorAll('.nav-item')[1];
            showTab('orders', ordersBtn);
        }

        // ===== БАЛАНС =====
        async function loadBalance() {
            try {
                const r = await fetch(API_URL + '/api/balance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: user?.id })
                });
                const d = await r.json();
                document.getElementById('balance').innerHTML = `${d.balance} <span>₽</span>`;
            } catch (e) {
                document.getElementById('balance').innerHTML = `0 <span>₽</span>`;
            }
        }

        // ===== ТОВАРЫ =====
        async function loadProducts() {
            try {
                const r = await fetch(API_URL + '/api/products');
                const d = await r.json();
                allProducts = d.products || [];
                renderProducts();
            } catch (e) {
                document.getElementById('products').innerHTML = '<p style="color:#888;text-align:center;padding:20px">❌ Ошибка загрузки</p>';
            }
        }

        function renderProducts() {
            const container = document.getElementById('products');
            const search = document.getElementById('searchInput').value.toLowerCase();

            let filtered = allProducts.filter(p => {
                if (search && !p.name.toLowerCase().includes(search)) return false;
                if (currentFilter === 'cheap' && p.price > 100) return false;
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<p style="color:#888;text-align:center;padding:20px">😕 Товаров нет</p>';
                return;
            }

            container.innerHTML = filtered.map(p => `
                <div class="product-card">
                    <div class="product-info">
                        <h3>${p.emoji || '🌍'} ${p.name}</h3>
                        <span class="product-count">📦 ${p.count} шт.</span>
                    </div>
                    <div class="product-right">
                        <span class="product-price">${p.price} ₽</span>
                        <button class="buy-btn" onclick="купить('${p.key}')">Купить</button>
                    </div>
                </div>
            `).join('');
        }

        function setFilter(f, el) {
            currentFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            renderProducts();
        }

        // ===== ЗАКАЗЫ =====
        async function loadOrders() {
            try {
                const r = await fetch(API_URL + '/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: user?.id })
                });
                const d = await r.json();
                const orders = d.orders || [];
                const container = document.getElementById('orders');

                if (orders.length === 0) {
                    container.innerHTML = '<p style="color:#888;text-align:center;padding:20px">📭 Заказов нет</p>';
                    return;
                }

                container.innerHTML = orders.map((o, i) => {
                    let statusClass = 'status-pending';
                    let statusText = 'В обработке';
                    if (o.status === 'одобрен') {
                        statusClass = 'status-approved';
                        statusText = '✓ Одобрен';
                    } else if (o.status === 'отклонён') {
                        statusClass = 'status-declined';
                        statusText = '✗ Отклонён';
                    }

                    return `
                        <div class="order-card">
                            <div class="order-header">
                                <h4>${o.product}</h4>
                                <span class="status-badge ${statusClass}">${statusText}</span>
                            </div>
                            <div class="order-info">💰 ${o.price} ₽</div>
                            <div class="order-info">📱 ${o.number || '—'}</div>
                            <button class="login-btn" onclick="открытьВход(${i})">🔑 Войти в аккаунт</button>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                document.getElementById('orders').innerHTML = '<p style="color:#888">❌ Ошибка загрузки</p>';
            }
        }

        // ===== ПОКУПКА =====
        async function купить(key) {
            tg.showConfirm('Купить товар?', async (confirmed) => {
                if (!confirmed) return;
                try {
                    const r = await fetch(API_URL + '/api/buy', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: user?.id, key })
                    });
                    const d = await r.json();
                    if (d.success) {
                        showToast(`✅ ${d.message}`, 'success');
                        loadBalance();
                        loadProducts();
                    } else {
                        showToast(`❌ ${d.error}`, 'error');
                    }
                } catch (e) {
                    showToast('❌ Ошибка сети', 'error');
                }
            });
        }

        // ===== ВХОД =====
        async function открытьВход(index) {
            const r = await fetch(API_URL + '/api/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: user?.id })
            });
            const d = await r.json();
            const order = d.orders[index];
            const phone = order.number || '—';

            tg.showPopup({
                title: '🔑 Вход в аккаунт',
                message: `📱 Номер: ${phone}\n\nНажми «Получить код» — код придёт в бот.`,
                buttons: [
                    { id: 'get_code', type: 'default', text: '📩 Получить код' },
                    { id: 'cancel', type: 'cancel', text: 'Отмена' }
                ]
            }, async (btn) => {
                if (btn === 'get_code') {
                    await fetch(API_URL + '/api/request_code', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: user?.id, phone, order_index: index })
                    });
                    showToast('📩 Запрос отправлен! Код придёт в бот.', 'success');
                }
            });
        }

        // ===== ПОПОЛНЕНИЕ =====
        function пополнить() {
            tg.showPopup({
                title: '💳 Пополнение баланса',
                message: 'Напиши @zilfrec для пополнения баланса',
                buttons: [
                    { id: 'open', type: 'default', text: '📩 Написать @zilfrec' },
                    { id: 'cancel', type: 'cancel', text: 'Отмена' }
                ]
            }, (btn) => {
                if (btn === 'open') tg.openTelegramLink('https://t.me/zilfrec');
            });
        }

        // ===== ПОДДЕРЖКА =====
        function поддержка() {
            tg.openTelegramLink('https://t.me/zilfrec');
        }

        // ===== ЗАПУСК =====
        loadBalance();
        loadProducts();
    </script>
</body>
</html>
